name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run unit tests
        run: |
          mkdir -p ~/.gemini/config
          echo '{"mcpServers":{"mssql":{"command":"node","args":[],"env":{"READONLY":"true"}}}}' > ~/.gemini/config/mcp_config.json
          npm test
